<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseGuard — know what you're signing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/script.js" defer></script>
</head>

<body>

    <nav>
        <a class="logo-container" href="index.html">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span class="logo-text">ClauseGuard</span>
        </a>
        <div class="nav-links">
            <span>Dashboard</span>
            <span class="active">Analyze</span>
            <span>History</span>
        </div>
    </nav>

    <main>
        <div class="uploader-center-wrapper">
            <h1 class="page-title">Upload your contract (PDF, DOCX) to begin analysis.</h1>

            <div class="uploader-card">
                <!-- Selected File Badge -->
                <div class="selected-file-badge" id="selected-file-badge">
                    <div class="file-meta-info">
                        <svg class="file-type-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <div>
                            <div class="file-name-text" id="file-name-text">document.pdf</div>
                            <div class="file-size-text" id="file-size-text">0 KB</div>
                        </div>
                    </div>
                    <button class="clear-file-btn" id="clear-file-btn" type="button" aria-label="Remove selected file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>

                <!-- Drop Zone -->
                <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Upload a contract file">
                    <div class="drop-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="8" y1="13" x2="16" y2="13"/>
                            <line x1="8" y1="17" x2="14" y2="17"/>
                            <line x1="8" y1="9" x2="10" y2="9"/>
                        </svg>
                    </div>
                    <button class="browse-btn" type="button">Browse Files</button>
                </div>
                <input type="file" id="file-input" accept=".pdf,.docx,.txt">

                <!-- Text Area Input -->
                <div class="textarea-wrapper">
                    <textarea id="paste-text" placeholder="Or paste contract text here..."></textarea>
                </div>

                <!-- Action Bar -->
                <div class="action-row">
                    <button class="analyze-button" id="analyze-btn" disabled>
                        <span class="spinner-icon" id="analyze-spinner"></span>
                        <span id="btn-text">Analyze</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
